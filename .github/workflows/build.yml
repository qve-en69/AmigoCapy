name: Build apps

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Версия
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Swift
        run: swift --version

      - name: Сборка
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: AmigoClick-mac
          path: dist/AmigoClick.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Сборка
        shell: bash
        run: |
          VERSION=1.0.0
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          dotnet build windows/AmigoClick.Windows.csproj -c Release -p:Version="$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: AmigoClick-windows
          path: windows/bin/Release/AmigoClick.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            files/AmigoClick.dmg
            files/AmigoClick.exe
